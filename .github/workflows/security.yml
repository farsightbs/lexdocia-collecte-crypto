name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi 06:00 UTC : une faille publiée sur une dépendance crypto doit remonter même sans commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit (dépendances de production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  licences:
    name: Licences des dépendances (politique, dérive, inventaire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-licenses.mjs

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  gitleaks:
    name: gitleaks (secrets dans l'historique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
